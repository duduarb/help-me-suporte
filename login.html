<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#00a859">
    <title>Login — Wiki Intelbras</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="images/wiki.png">
</head>
<body class="pagina-login">

    <main class="login-box">
        <div class="login-topo">
            <img src="images/wiki.png" alt="Logo da Wiki Suporte Consumo">
            <h1>Wiki Suporte Consumo</h1>
            <p>Acesso restrito — apenas administradores</p>
        </div>

        <form class="login-form" onsubmit="return false">
            <div class="campo">
                <label for="loginEmail">E-mail</label>
                <input type="email" id="loginEmail" placeholder="seu@email.com" autocomplete="email">
            </div>
            <div class="campo">
                <label for="loginSenha">Senha</label>
                <input type="password" id="loginSenha" placeholder="••••••••" autocomplete="current-password">
            </div>

            <button type="submit" class="btn-entrar" id="btnEntrar">Entrar</button>

            <div class="erro-msg" id="erroMsg" role="alert"></div>

            <a href="index.html" class="voltar">← Voltar para a wiki</a>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/login.js"></script>
</body>
</html>
